seed: 1
data:
  url: https://archive.ics.uci.edu/static/public/280/higgs.zip
  raw_path: data/raw/higgs.zip
  array_path: /Users/ananyasoni/Downloads/aml_project/Higgs_Boson_Classification/data/processed/higgs_f32.npy
  splits_dir: /Users/ananyasoni/Downloads/aml_project/Higgs_Boson_Classification/data/splits
  n_test: 500000
  subset_size: 250000
  val_fraction: 0.1
  cal_fraction: 0.1
feature_sets:
- low
- geo
- high
- all
- geo_high
models:
- logreg
- xgboost
- mlp
- widedeep
tuned_params: results/tuning/best_params.json
logreg:
  C: 1.0
  max_iter: 1000
xgboost:
  n_estimators: 3000
  learning_rate: 0.1
  max_depth: 6
  min_child_weight: 1
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  early_stopping_rounds: 50
  n_jobs: -1
mlp:
  hidden:
  - 256
  - 256
  - 256
  activation: relu
  batchnorm: true
  init: xavier
  dropout: 0.1
  lr: 0.001
  weight_decay: 1.0e-05
  batch_size: 1024
  max_epochs: 50
  patience: 6
  device: auto
widedeep:
  feature_sets:
  - geo_high
  n_wide: 7
  hidden:
  - 256
  - 256
  - 256
  wide_hidden: 32
  activation: relu
  batchnorm: true
  init: xavier
  dropout: 0.1
  lr: 0.001
  weight_decay: 1.0e-05
  batch_size: 1024
  max_epochs: 50
  patience: 6
  device: auto
stacking:
  base:
  - xgboost
  - mlp
calibration_bins: 15
output_dir: results
