seed: 42
data:
  url: https://archive.ics.uci.edu/ml/machine-learning-databases/00280/HIGGS.csv.gz
  raw_path: data/raw/HIGGS.csv.gz
  array_path: /Users/ananyasoni/Downloads/aml_project/Higgs_Boson_Classification/data/processed/higgs_f32.npy
  splits_dir: /Users/ananyasoni/Downloads/aml_project/Higgs_Boson_Classification/data/splits
  n_test: 500000
  subset_size: 250000
  val_fraction: 0.1
feature_sets:
- low
- geo
- high
- all
models:
- logreg
- xgboost
- mlp
logreg:
  C: 1.0
  max_iter: 1000
xgboost:
  n_estimators: 2000
  learning_rate: 0.1
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50
  n_jobs: -1
mlp:
  hidden:
  - 256
  - 256
  - 256
  dropout: 0.1
  lr: 0.001
  weight_decay: 1.0e-05
  batch_size: 1024
  max_epochs: 50
  patience: 6
  device: auto
output_dir: results
